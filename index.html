<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a1f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>スト6研究所</title></head><body><header><h1>スト6研究所</h1><div class="small">対戦を記録して、負け方を潰す</div></header><main>
<section class="card"><div class="grid4"><input data-bind="main" placeholder="メインキャラ"><input data-bind="rank" placeholder="現在ランク・MR"><input data-bind="goal" placeholder="今の目標"><input data-bind="today" placeholder="今日のテーマ"></div></section>
<section class="card"><div class="kpis"><div class="kpi"><span class="small">総試合</span><strong id="total">0</strong></div><div class="kpi"><span class="small">勝ち</span><strong id="wins">0</strong></div><div class="kpi"><span class="small">負け</span><strong id="losses">0</strong></div><div class="kpi"><span class="small">勝率</span><strong id="rate">0%</strong></div><div class="kpi"><span class="small">直近10戦</span><strong id="recent">0%</strong></div></div></section>
<div class="toolbar"><button onclick="exportData()">バックアップ</button><label class="btn secondary">読み込む<input id="importer" type="file" accept=".json" hidden></label><button class="danger" onclick="resetAll()">全削除</button></div>
<section class="card"><div class="tabs"><button class="tab active" data-page="matches">対戦記録</button><button class="tab" data-page="stats">キャラ別戦績</button><button class="tab" data-page="matchups">キャラ対策</button><button class="tab" data-page="patterns">負けパターン</button><button class="tab" data-page="training">練習課題</button><button class="tab" data-page="rashid">ラシード研究</button><button class="tab" data-page="notes">メモ</button></div>
<div id="matches" class="page active"><div class="grid4"><input id="mdate" type="date"><input id="mopp" placeholder="相手キャラ"><select id="mresult"><option>勝ち</option><option>負け</option></select><input id="mmr" placeholder="自分MR / 相手MR"></div><div class="grid3"><select id="mmode"><option>ランクマ</option><option>カスタム</option><option>バトルハブ</option><option>大会</option></select><input id="mround" placeholder="例：2-1"><input id="mtag" placeholder="タグ"></div><div class="grid2"><textarea id="mgood" placeholder="良かった点"></textarea><textarea id="mbad" placeholder="悪かった点・負けた理由"></textarea></div><input id="mnext" placeholder="次の一口メモ"><br><br><button onclick="addMatch()">対戦を記録</button><div id="matchList"></div></div>
<div id="stats" class="page"><div id="charStats" class="scroll"></div></div>
<div id="matchups" class="page"><div class="grid3"><input id="uopp" placeholder="相手キャラ"><input id="udanger" placeholder="危険な技・状況"><input id="upunish" placeholder="確反・反撃"></div><div class="grid2"><textarea id="udefense" placeholder="守り方"></textarea><textarea id="uoffense" placeholder="攻め方・狙い"></textarea></div><textarea id="usituations" placeholder="開幕・中央・端・起き攻めなど"></textarea><button onclick="addMatchup()">追加</button><div id="matchupList"></div></div>
<div id="patterns" class="page"><div class="grid3"><input id="pname" placeholder="負けパターン名"><input id="ptrigger" placeholder="起きる状況"><select id="pfreq"><option>多い</option><option>普通</option><option>少ない</option></select></div><div class="grid2"><textarea id="pcause" placeholder="原因"></textarea><textarea id="pcounter" placeholder="対策"></textarea></div><button onclick="addPattern()">追加</button><div id="patternList"></div></div>
<div id="training" class="page"><div class="grid3"><input id="ttask" placeholder="練習内容"><select id="tpriority"><option>高</option><option>中</option><option>低</option></select><select id="tstatus"><option>未着手</option><option>練習中</option><option>実戦投入</option><option>安定</option></select></div><input id="tcondition" placeholder="成功条件"><textarea id="tnote" placeholder="練習方法・注意点"></textarea><button onclick="addTask()">追加</button><div id="taskList"></div></div>
<div id="rashid" class="page"><div class="grid2"><textarea data-bind="neutral" placeholder="立ち回り"></textarea><textarea data-bind="antiair" placeholder="対空"></textarea><textarea data-bind="oki" placeholder="起き攻め"></textarea><textarea data-bind="corner" placeholder="端攻め"></textarea><textarea data-bind="defense" placeholder="守り"></textarea><textarea data-bind="combo" placeholder="コンボ"></textarea></div></div>
<div id="notes" class="page"><textarea data-bind="notes" style="min-height:420px" placeholder="自由メモ"></textarea></div></section></main>
<script>
const KEY='sf6_lab_v1';let data={profile:{main:'ラシード',rank:'',goal:'',today:'',neutral:'',antiair:'',oki:'',corner:'',defense:'',combo:'',notes:''},matches:[],matchups:[],patterns:[],tasks:[]};const $=x=>document.getElementById(x),v=x=>$(x).value.trim(),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(data));stats()}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)data=x}catch(e){}document.querySelectorAll('[data-bind]').forEach(el=>{el.value=data.profile[el.dataset.bind]??'';el.oninput=()=>{data.profile[el.dataset.bind]=el.value;save()}});$('mdate').value=new Date().toISOString().slice(0,10);render()}function del(t,i){if(confirm('削除しますか？')){data[t].splice(i,1);save();render()}}function addMatch(){if(!v('mopp'))return alert('相手キャラを入力してね');data.matches.unshift({date:$('mdate').value,opp:v('mopp'),result:$('mresult').value,mr:v('mmr'),mode:$('mmode').value,round:v('mround'),tag:v('mtag'),good:v('mgood'),bad:v('mbad'),next:v('mnext')});['mopp','mmr','mround','mtag','mgood','mbad','mnext'].forEach(x=>$(x).value='');save();render()}function addMatchup(){if(!v('uopp'))return alert('相手キャラを入力してね');data.matchups.push({opp:v('uopp'),danger:v('udanger'),punish:v('upunish'),defense:v('udefense'),offense:v('uoffense'),situations:v('usituations')});['uopp','udanger','upunish','udefense','uoffense','usituations'].forEach(x=>$(x).value='');save();render()}function addPattern(){if(!v('pname'))return alert('名前を入力してね');data.patterns.push({name:v('pname'),trigger:v('ptrigger'),freq:$('pfreq').value,cause:v('pcause'),counter:v('pcounter')});['pname','ptrigger','pcause','pcounter'].forEach(x=>$(x).value='');save();render()}function addTask(){if(!v('ttask'))return alert('練習内容を入力してね');data.tasks.push({task:v('ttask'),priority:$('tpriority').value,status:$('tstatus').value,condition:v('tcondition'),note:v('tnote')});['ttask','tcondition','tnote'].forEach(x=>$(x).value='');save();render()}function stats(){const t=data.matches.length,w=data.matches.filter(x=>x.result==='勝ち').length;$('total').textContent=t;$('wins').textContent=w;$('losses').textContent=t-w;$('rate').textContent=t?Math.round(w/t*100)+'%':'0%';const r=data.matches.slice(0,10),rw=r.filter(x=>x.result==='勝ち').length;$('recent').textContent=r.length?Math.round(rw/r.length*100)+'%':'0%'}function render(){$('matchList').innerHTML=data.matches.length?'<div class="scroll"><table><tr><th>日付</th><th>相手</th><th>結果</th><th>内容</th><th></th></tr>'+data.matches.map((x,i)=>`<tr><td>${esc(x.date)}<div class="small">${esc(x.mode)}</div></td><td><b>${esc(x.opp)}</b><div class="small">${esc(x.mr)} ${esc(x.round)}</div></td><td>${esc(x.result)}</td><td>良:${esc(x.good)}<br>悪:${esc(x.bad)}<br>次:${esc(x.next)}<div class="small">${esc(x.tag)}</div></td><td><button class="danger" onclick="del('matches',${i})">削除</button></td></tr>`).join('')+'</table></div>':'<div class="small">対戦記録なし</div>';const g={};data.matches.forEach(x=>{g[x.opp]??={w:0,l:0};x.result==='勝ち'?g[x.opp].w++:g[x.opp].l++});$('charStats').innerHTML=Object.keys(g).length?'<table><tr><th>相手</th><th>試合</th><th>勝ち</th><th>負け</th><th>勝率</th></tr>'+Object.entries(g).map(([c,s])=>{const t=s.w+s.l;return `<tr><td>${esc(c)}</td><td>${t}</td><td>${s.w}</td><td>${s.l}</td><td>${Math.round(s.w/t*100)}%</td></tr>`}).join('')+'</table>':'<div class="small">対戦記録を入れると表示されます</div>';$('matchupList').innerHTML=data.matchups.map((x,i)=>`<div class="item"><div class="top"><div><div class="title">${esc(x.opp)}</div><div class="small">危険:${esc(x.danger)} / 確反:${esc(x.punish)}</div></div><button class="danger" onclick="del('matchups',${i})">削除</button></div><div class="small">守り:${esc(x.defense)}<br>攻め:${esc(x.offense)}<br>${esc(x.situations)}</div></div>`).join('');$('patternList').innerHTML=data.patterns.map((x,i)=>`<div class="item"><div class="top"><div><div class="title">${esc(x.name)}</div><div class="small">${esc(x.freq)} / ${esc(x.trigger)}</div></div><button class="danger" onclick="del('patterns',${i})">削除</button></div><div class="small">原因:${esc(x.cause)}<br>対策:${esc(x.counter)}</div></div>`).join('');$('taskList').innerHTML=data.tasks.map((x,i)=>`<div class="item"><div class="top"><div><div class="title">${esc(x.task)}</div><div class="small">優先:${esc(x.priority)} / ${esc(x.status)}</div></div><button class="danger" onclick="del('tasks',${i})">削除</button></div><div class="small">成功条件:${esc(x.condition)}<br>${esc(x.note)}</div></div>`).join('');stats()}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='スト6研究所_バックアップ.json';a.click()}$('importer').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();location.reload()}catch(e){alert('読み込めませんでした')}};r.readAsText(f)};function resetAll(){if(confirm('本当に全削除しますか？')){localStorage.removeItem(KEY);location.reload()}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active')});if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');load();
</script></body></html>
