<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f6ef">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>STREET FIGHTER 6 RESEARCH LAB</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <button class="menu-mark" aria-label="メニュー">☰</button>
    <nav class="side-nav" aria-label="メインメニュー">
      <button class="nav-btn active" data-page="home"><span>⌂</span><small>ホーム</small></button>
      <button class="nav-btn" data-page="matchups"><span>◎</span><small>対策メモ</small></button>
      <button class="nav-btn" data-page="stats"><span>♙</span><small>キャラ一覧</small></button>
      <button class="nav-btn" data-page="analysis"><span>⌁</span><small>データ分析</small></button>
      <button class="nav-btn" data-page="matches"><span>▤</span><small>試合記録</small></button>
      <button class="nav-btn" data-page="settings"><span>⚙</span><small>設定</small></button>
    </nav>
  </aside>

  <main class="workspace">
    <section id="home" class="page active home-page">
      <header class="hero">
        <div>
          <p>STREET FIGHTER 6</p>
          <h1>RESEARCH LAB</h1>
          <div class="crayon-line"></div>
        </div>
        <div class="doodles" aria-hidden="true">☆　☆　☆</div>
        <div class="sticky-note"><span>今日も<br>研究しよう。</span><b>♔</b></div>
      </header>

      <div class="dashboard-grid">
        <article class="paper-card today-card">
          <h2>今日の課題</h2>
          <div id="todayTasks" class="check-list"></div>
        </article>

        <article class="paper-card win-card">
          <h2>勝率グラフ（直近20戦）</h2>
          <div class="chart-wrap">
            <svg id="winChart" viewBox="0 0 300 150" role="img" aria-label="直近20戦の勝率推移"></svg>
            <div class="big-rate"><span>勝率</span><strong id="homeRate">0%</strong></div>
          </div>
        </article>

        <article class="paper-card weak-card">
          <h2>苦手キャラTOP3</h2>
          <div id="weakTop" class="ranking"></div>
        </article>

        <article class="paper-card memo-card">
          <div class="tape" aria-hidden="true"></div>
          <h2>最近のメモ</h2>
          <div id="recentMemo" class="memo-lines"></div>
        </article>
      </div>
      <div class="star star-one" aria-hidden="true">☆</div>
      <div class="star star-two" aria-hidden="true">☆</div>
    </section>

    <section id="matches" class="page">
      <div class="page-heading"><div><p>FIELD NOTES</p><h1>試合記録</h1></div><button class="accent" onclick="addMatch()">対戦を記録</button></div>
      <div class="paper-card form-card">
        <div class="grid4"><input id="mdate" type="date"><input id="mopp" placeholder="相手キャラ"><select id="mresult"><option>勝ち</option><option>負け</option></select><input id="mmr" placeholder="自分MR / 相手MR"></div>
        <div class="grid3"><select id="mmode"><option>ランクマ</option><option>カスタム</option><option>バトルハブ</option><option>大会</option></select><input id="mround" placeholder="例：2-1"><input id="mtag" placeholder="タグ"></div>
        <div class="grid2"><textarea id="mgood" placeholder="良かった点"></textarea><textarea id="mbad" placeholder="悪かった点・負けた理由"></textarea></div>
        <input id="mnext" placeholder="次の一口メモ">
      </div>
      <div id="matchList"></div>
    </section>

    <section id="stats" class="page">
      <div class="page-heading"><div><p>CHARACTER FILES</p><h1>キャラ一覧</h1></div></div>
      <div class="paper-card"><div id="charStats" class="scroll"></div></div>
    </section>

    <section id="matchups" class="page">
      <div class="page-heading"><div><p>MATCHUP RESEARCH</p><h1>対策メモ</h1></div><button class="accent" onclick="addMatchup()">追加</button></div>
      <div class="paper-card form-card"><div class="grid3"><input id="uopp" placeholder="相手キャラ"><input id="udanger" placeholder="危険な技・状況"><input id="upunish" placeholder="確反・反撃"></div><div class="grid2"><textarea id="udefense" placeholder="守り方"></textarea><textarea id="uoffense" placeholder="攻め方・狙い"></textarea></div><textarea id="usituations" placeholder="開幕・中央・端・起き攻めなど"></textarea></div>
      <div id="matchupList"></div>
    </section>

    <section id="analysis" class="page">
      <div class="page-heading"><div><p>DATA ANALYSIS</p><h1>データ分析</h1></div></div>
      <div class="kpis"><div class="kpi"><span>総試合</span><strong id="total">0</strong></div><div class="kpi"><span>勝ち</span><strong id="wins">0</strong></div><div class="kpi"><span>負け</span><strong id="losses">0</strong></div><div class="kpi"><span>勝率</span><strong id="rate">0%</strong></div><div class="kpi"><span>直近10戦</span><strong id="recent">0%</strong></div></div>
      <div class="two-column">
        <div class="paper-card"><h2>負けパターン</h2><div class="grid3"><input id="pname" placeholder="負けパターン名"><input id="ptrigger" placeholder="起きる状況"><select id="pfreq"><option>多い</option><option>普通</option><option>少ない</option></select></div><div class="grid2"><textarea id="pcause" placeholder="原因"></textarea><textarea id="pcounter" placeholder="対策"></textarea></div><button class="accent" onclick="addPattern()">追加</button><div id="patternList"></div></div>
        <div class="paper-card"><h2>練習課題</h2><div class="grid3"><input id="ttask" placeholder="練習内容"><select id="tpriority"><option>高</option><option>中</option><option>低</option></select><select id="tstatus"><option>未着手</option><option>練習中</option><option>実戦投入</option><option>安定</option></select></div><input id="tcondition" placeholder="成功条件"><textarea id="tnote" placeholder="練習方法・注意点"></textarea><button class="accent" onclick="addTask()">追加</button><div id="taskList"></div></div>
      </div>
    </section>

    <section id="settings" class="page">
      <div class="page-heading"><div><p>LAB SETTINGS</p><h1>設定</h1></div></div>
      <div class="paper-card settings-card">
        <h2>プロフィール</h2>
        <div class="grid4"><input data-bind="main" placeholder="メインキャラ"><input data-bind="rank" placeholder="現在ランク・MR"><input data-bind="goal" placeholder="今の目標"><input data-bind="today" placeholder="今日のテーマ"></div>
        <h2>ラシード研究</h2>
        <div class="grid2"><textarea data-bind="neutral" placeholder="立ち回り"></textarea><textarea data-bind="antiair" placeholder="対空"></textarea><textarea data-bind="oki" placeholder="起き攻め"></textarea><textarea data-bind="corner" placeholder="端攻め"></textarea><textarea data-bind="defense" placeholder="守り"></textarea><textarea data-bind="combo" placeholder="コンボ"></textarea></div>
        <h2>自由メモ</h2><textarea data-bind="notes" class="long-note" placeholder="自由メモ"></textarea>
        <h2>表示</h2><button id="themeToggle" class="secondary">ダークモードに切り替え</button>
        <h2>データ</h2><div class="toolbar"><button onclick="exportData()">バックアップ</button><label class="btn secondary">読み込む<input id="importer" type="file" accept=".json" hidden></label><button class="danger" onclick="resetAll()">全削除</button></div>
      </div>
    </section>
  </main>
</div>

<nav class="mobile-nav" aria-label="モバイルメニュー">
  <button class="nav-btn active" data-page="home"><span>⌂</span><small>ホーム</small></button>
  <button class="nav-btn" data-page="matchups"><span>◎</span><small>対策</small></button>
  <button class="nav-btn" data-page="stats"><span>♙</span><small>キャラ</small></button>
  <button class="nav-btn" data-page="analysis"><span>⌁</span><small>分析</small></button>
  <button class="nav-btn" data-page="matches"><span>▤</span><small>記録</small></button>
  <button class="nav-btn" data-page="settings"><span>⚙</span><small>設定</small></button>
</nav>

<script>
const KEY='sf6_lab_v1';
const THEME_KEY='sf6_lab_theme';
let data={profile:{main:'ラシード',rank:'',goal:'',today:'',neutral:'',antiair:'',oki:'',corner:'',defense:'',combo:'',notes:''},matches:[],matchups:[],patterns:[],tasks:[]};
const $=x=>document.getElementById(x),v=x=>$(x).value.trim(),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)data=x}catch(e){}document.querySelectorAll('[data-bind]').forEach(el=>{el.value=data.profile[el.dataset.bind]??'';el.oninput=()=>{data.profile[el.dataset.bind]=el.value;localStorage.setItem(KEY,JSON.stringify(data));renderHome()}});$('mdate').value=new Date().toISOString().slice(0,10);render()}
function del(t,i){if(confirm('削除しますか？')){data[t].splice(i,1);save()}}
function addMatch(){if(!v('mopp'))return alert('相手キャラを入力してね');data.matches.unshift({date:$('mdate').value,opp:v('mopp'),result:$('mresult').value,mr:v('mmr'),mode:$('mmode').value,round:v('mround'),tag:v('mtag'),good:v('mgood'),bad:v('mbad'),next:v('mnext')});['mopp','mmr','mround','mtag','mgood','mbad','mnext'].forEach(x=>$(x).value='');save()}
function addMatchup(){if(!v('uopp'))return alert('相手キャラを入力してね');data.matchups.push({opp:v('uopp'),danger:v('udanger'),punish:v('upunish'),defense:v('udefense'),offense:v('uoffense'),situations:v('usituations')});['uopp','udanger','upunish','udefense','uoffense','usituations'].forEach(x=>$(x).value='');save()}
function addPattern(){if(!v('pname'))return alert('名前を入力してね');data.patterns.push({name:v('pname'),trigger:v('ptrigger'),freq:$('pfreq').value,cause:v('pcause'),counter:v('pcounter')});['pname','ptrigger','pcause','pcounter'].forEach(x=>$(x).value='');save()}
function addTask(){if(!v('ttask'))return alert('練習内容を入力してね');data.tasks.push({task:v('ttask'),priority:$('tpriority').value,status:$('tstatus').value,condition:v('tcondition'),note:v('tnote')});['ttask','tcondition','tnote'].forEach(x=>$(x).value='');save()}
function stats(){const t=data.matches.length,w=data.matches.filter(x=>x.result==='勝ち').length;$('total').textContent=t;$('wins').textContent=w;$('losses').textContent=t-w;$('rate').textContent=t?Math.round(w/t*100)+'%':'0%';const r=data.matches.slice(0,10),rw=r.filter(x=>x.result==='勝ち').length;$('recent').textContent=r.length?Math.round(rw/r.length*100)+'%':'0%'}
function renderHome(){
  const tasks=data.tasks.filter(x=>x.status!=='安定').slice(0,3);const fallback=[data.profile.today||'今日のテーマを設定しよう','苦手な状況を1つ整理','対戦後に一口メモを残す'];
  $('todayTasks').innerHTML=(tasks.length?tasks.map(x=>x.task):fallback).map((x,i)=>`<label><input type="checkbox"><span>${esc(x)}</span><i></i></label>`).join('');
  const t=data.matches.length,w=data.matches.filter(x=>x.result==='勝ち').length;$('homeRate').textContent=t?Math.round(w/t*100)+'%':'0%';
  const groups={};data.matches.forEach(x=>{groups[x.opp]??={w:0,l:0};x.result==='勝ち'?groups[x.opp].w++:groups[x.opp].l++});
  const weak=Object.entries(groups).map(([name,s])=>({name,rate:Math.round(s.w/(s.w+s.l)*100),games:s.w+s.l})).filter(x=>x.games>0).sort((a,b)=>a.rate-b.rate).slice(0,3);
  $('weakTop').innerHTML=(weak.length?weak:[{name:'CAMMY',rate:28},{name:'RYU',rate:35},{name:'KEN',rate:42}]).map((x,i)=>`<div><b>${i+1}</b><span>${esc(x.name)}</span><strong>${x.rate}%</strong></div>`).join('');
  const memos=data.matches.map(x=>x.next||x.bad).filter(Boolean).slice(0,4);const profileNotes=(data.profile.notes||'').split(/\n+/).filter(Boolean).slice(0,4-memos.length);const all=[...memos,...profileNotes].slice(0,4);
  $('recentMemo').innerHTML=(all.length?all:['ラシード　風SA後 +2F','中足ラッシュの暴れに注意','生ラッシュ → 投げ / DR','端では中足 → 中サイクロン']).map(x=>`<p>・${esc(x)}</p>`).join('');
  drawChart();
}
function drawChart(){const svg=$('winChart'),list=[...data.matches].slice(0,20).reverse();let wins=0;const rates=list.map((x,i)=>{if(x.result==='勝ち')wins++;return Math.round(wins/(i+1)*100)});const vals=rates.length?rates:[8,22,35,52,43,59,47,38,45,39,42,55,48,61,70,82];const pts=vals.map((r,i)=>`${18+i*(260/Math.max(vals.length-1,1))},${128-r*1.05}`).join(' ');svg.innerHTML=`<g class="grid-lines"><line x1="18" y1="23" x2="278" y2="23"/><line x1="18" y1="75" x2="278" y2="75"/><line x1="18" y1="128" x2="278" y2="128"/><line x1="18" y1="23" x2="18" y2="128"/></g><text x="0" y="28">100%</text><text x="3" y="80">50%</text><text x="8" y="133">0%</text><polyline points="${pts}" fill="none" class="chart-line"/>${pts.split(' ').map(p=>{const [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="3.2"/>`}).join('')}`}
function render(){
  $('matchList').innerHTML=data.matches.length?'<div class="paper-card scroll"><table><tr><th>日付</th><th>相手</th><th>結果</th><th>内容</th><th></th></tr>'+data.matches.map((x,i)=>`<tr><td>${esc(x.date)}<div class="small">${esc(x.mode)}</div></td><td><b>${esc(x.opp)}</b><div class="small">${esc(x.mr)} ${esc(x.round)}</div></td><td>${esc(x.result)}</td><td>良:${esc(x.good)}<br>悪:${esc(x.bad)}<br>次:${esc(x.next)}<div class="small">${esc(x.tag)}</div></td><td><button class="danger" onclick="del('matches',${i})">削除</button></td></tr>`).join('')+'</table></div>':'<div class="paper-card small">対戦記録なし</div>';
  const g={};data.matches.forEach(x=>{g[x.opp]??={w:0,l:0};x.result==='勝ち'?g[x.opp].w++:g[x.opp].l++});$('charStats').innerHTML=Object.keys(g).length?'<table><tr><th>相手</th><th>試合</th><th>勝ち</th><th>負け</th><th>勝率</th></tr>'+Object.entries(g).map(([c,s])=>{const t=s.w+s.l;return `<tr><td>${esc(c)}</td><td>${t}</td><td>${s.w}</td><td>${s.l}</td><td>${Math.round(s.w/t*100)}%</td></tr>`}).join('')+'</table>':'<div class="small">対戦記録を入れると表示されます</div>';
  $('matchupList').innerHTML=data.matchups.map((x,i)=>`<div class="paper-card item"><div class="top"><div><div class="title">${esc(x.opp)}</div><div class="small">危険:${esc(x.danger)} / 確反:${esc(x.punish)}</div></div><button class="danger" onclick="del('matchups',${i})">削除</button></div><div class="small">守り:${esc(x.defense)}<br>攻め:${esc(x.offense)}<br>${esc(x.situations)}</div></div>`).join('');
  $('patternList').innerHTML=data.patterns.map((x,i)=>`<div class="item"><div class="top"><div><div class="title">${esc(x.name)}</div><div class="small">${esc(x.freq)} / ${esc(x.trigger)}</div></div><button class="danger" onclick="del('patterns',${i})">削除</button></div><div class="small">原因:${esc(x.cause)}<br>対策:${esc(x.counter)}</div></div>`).join('');
  $('taskList').innerHTML=data.tasks.map((x,i)=>`<div class="item"><div class="top"><div><div class="title">${esc(x.task)}</div><div class="small">優先:${esc(x.priority)} / ${esc(x.status)}</div></div><button class="danger" onclick="del('tasks',${i})">削除</button></div><div class="small">成功条件:${esc(x.condition)}<br>${esc(x.note)}</div></div>`).join('');
  stats();renderHome();
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='スト6研究所_バックアップ.json';a.click()}
$('importer').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();location.reload()}catch(e){alert('読み込めませんでした')}};r.readAsText(f)};
function resetAll(){if(confirm('本当に全削除しますか？')){localStorage.removeItem(KEY);location.reload()}}
function goPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>goPage(b.dataset.page));
function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem(THEME_KEY,theme);$('themeToggle').textContent=theme==='dark'?'ライトモードに切り替え':'ダークモードに切り替え';document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#0d1114':'#f8f6ef'}
$('themeToggle').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
applyTheme(localStorage.getItem(THEME_KEY)|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
load();
</script>
</body>
</html>
